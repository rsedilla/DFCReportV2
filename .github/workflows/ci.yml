name: CI

# Continuous integration from day one.
#
# Retrofitting CI across an existing codebase is how gaps ship (docs/ROADMAP.md,
# Stage 1 risk), so this exists before the application has a single feature.
#
# `api` and `web` are intended to be required status checks on `main`. Until they
# are marked required in branch protection, this workflow reports and gates
# nothing, which is a weaker thing than it looks: a pull request with a red build
# can still be merged on an approval alone.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostgreSQL 16 is the minimum version. The CYCLE clause that makes every
        # recursive subtree query cycle-safe needs 14 or later, and pinning it
        # means the visited-path fallback is never written (SKILL.md section 5).
        image: postgres:16-alpine
        env:
          # Not a secret. This container lives for the length of one job, is
          # reachable only from it, and holds nothing but fixtures.
          POSTGRES_USER: dfc_ci
          POSTGRES_PASSWORD: dfc_ci
          POSTGRES_DB: dfc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dfc_ci -d dfc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dfc_ci:dfc_ci@localhost:5432/dfc_ci

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      # Reversible, or explicitly marked irreversible and escalated before it runs
      # (CLAUDE.md, migration policy). Down and up again is how that stays true.
      - name: Apply migrations
        run: npm run migrate:up

      - name: Revert and re-apply migrations
        run: |
          npm run migrate:down
          npm run migrate:up

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  web:
    name: web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # `lint` runs three checks beyond ESLint, each holding a rule the
      # specification states and review would not catch: no API routes or server
      # actions (SKILL.md section 2), no design-system component framework
      # (section 2), and WCAG 2.2 AA contrast with no judgement-named token
      # (section 23, and sections 13, 17 and 19).
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  authorization-suite:
    name: authorization suite (Stage 2 target, failing by design)
    runs-on: ubuntu-latest

    # Reported, never required. The eleven cases of CLAUDE.md are written against
    # an endpoint Stage 2 builds, and they fail today because it does not exist.
    # Stage 2 is done when they are green, at which point they fold into `api`
    # and this job is deleted.
    #
    # The flag is on the suite step alone, not on the job. On the job it made the
    # check conclude success whatever happened -- including a failure of the step
    # that checks *why* the suite failed, which would then report nothing.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dfc_ci
          POSTGRES_PASSWORD: dfc_ci
          POSTGRES_DB: dfc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dfc_ci -d dfc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dfc_ci:dfc_ci@localhost:5432/dfc_ci

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm run migrate:up

      - name: Run the eleven authorization cases
        id: suite
        continue-on-error: true
        run: npm run test:authorization 2>&1 | tee suite.log; exit ${PIPESTATUS[0]}

      # "Failing for the right reason" was asserted in prose and checked by nobody.
      # The suite may fail -- that is the point of the job -- but it may not fail in
      # a new way, and a suite that failed because the application would not boot
      # would have read as expected here.
      - name: Check that they fail for the right reason
        if: steps.suite.outcome == 'failure'
        run: |
          # Assert what should be there, not merely the absence of what should not.
          # "No counter-evidence" cannot tell "every case failed on a 404" from
          # "nothing ran at all" -- a failed migration, a missing JWT_SECRET or a
          # throw in beforeAll produces no `Received:` line whatsoever, and the
          # earlier form of this check reported those as expected.
          if ! grep -qE 'Tests:[[:space:]]+[0-9]+ failed' suite.log; then
            echo "::error::The authorization suite produced no test results at all."
            echo "::error::That is a suite that did not run, not a suite failing as expected."
            tail -30 suite.log
            exit 1
          fi

          if ! grep -q 'Received: 404' suite.log; then
            echo "::error::No case reached the endpoint and received a 404."
            tail -30 suite.log
            exit 1
          fi

          # Cases asserting with toContain or toHaveLength print `Received array:`
          # and `Received length:`; only a bare `Received:` is a status assertion.
          if grep -E '^[[:space:]]*Received: ' suite.log | grep -qv 'Received: 404'; then
            echo "::error::A case failed on a status other than 404, so the suite is no"
            echo "::error::longer failing only because the endpoint is absent."
            grep -nE '^[[:space:]]*Received: ' suite.log | grep -v 'Received: 404' | head -20
            exit 1
          fi

          # Nothing above ties the failure count to the case count. Half an endpoint
          # landing, with six cases passing and five failing on 404, would read as
          # "expected" -- so require that no case passed quietly.
          summary=$(grep -E '^Tests:' suite.log | tail -1)
          failed=$(echo "$summary" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+')
          total=$(echo "$summary" | grep -oE '[0-9]+ total' | grep -oE '[0-9]+')

          if [ "$failed" != "$total" ]; then
            if echo "$summary" | grep -qE '[0-9]+ (skipped|todo)'; then
              # The 2026-08-20 ruling is explicit: these are not skipped, not
              # marked pending, and not inverted to pass on failure.
              echo "::error::Some cases were skipped or marked todo:"
            else
              echo "::error::Some cases passed, which is progress rather than a fault:"
            fi
            echo "::error::  $summary"
            echo "::error::This job asserts every case fails. If Stage 2 has landed, move"
            echo "::error::them into the api suite and delete this job."
            exit 1
          fi

          # `Tests:` counts only the cases that ran. A second spec file that fails
          # to collect prints `Test Suites: 1 failed, 1 passed, 2 total` while the
          # case counts stay consistent, so the suite line is checked too.
          suites=$(grep -E '^Test Suites:' suite.log | tail -1)
          suitesFailed=$(echo "$suites" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+')
          suitesTotal=$(echo "$suites" | grep -oE '[0-9]+ total' | grep -oE '[0-9]+')

          if [ "$suitesFailed" != "$suitesTotal" ]; then
            echo "::error::A spec file in this suite did not fail as expected:"
            echo "::error::  $suites"
            exit 1
          fi

          echo "The suite ran, every case failed, and every status assertion received 404."

      - name: Report
        run: |
          {
            echo "## Authorization suite"
            echo
            if [ "${{ steps.suite.outcome }}" = "success" ]; then
              echo "All eleven cases passed."
              echo
              echo "If this is still Stage 1, that is a surprise worth investigating:"
              echo "the endpoint they exercise is not built yet, so they should fail."
              echo "If Stage 2 has landed, move them into the main suite and delete"
              echo "this job."
            else
              echo "The eleven cases fail, which is expected until Stage 2 builds"
              echo "\`PUT /api/v1/people/{id}/pastoral-leader\`, and the step above"
              echo "checked that no case passed quietly and that every status"
              echo "assertion received a 404 rather than something new. Cases that"
              echo "assert with toContain print no bare status line and contribute"
              echo "no evidence either way."
              echo
              echo "See \`api/test/authorization/pastoral-assignment.spec.ts\` for the"
              echo "contract they pin, and docs/ROADMAP.md for why they are written"
              echo "first."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
