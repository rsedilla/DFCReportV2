name: CI

# Continuous integration from day one.
#
# Retrofitting CI across an existing codebase is how gaps ship (docs/ROADMAP.md,
# Stage 1 risk), so this exists before the application has a single feature.
#
# `api` and `web` are required status checks on `main`, and branches must be up to
# date before merging. Changing which checks gate `main` is a change to branch
# protection, not to this file.
#
# The eleven authorization cases of CLAUDE.md ran here as their own reported-but-
# not-required job while they failed by design, so that `api` stayed honestly green
# on an application with no features. They are green now, so they have folded into
# `api` and that job is gone -- which is the point: from here they gate `main`
# rather than being reported beside it.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostgreSQL 16 is the minimum version. The CYCLE clause that makes every
        # recursive subtree query cycle-safe needs 14 or later, and pinning it
        # means the visited-path fallback is never written (SKILL.md section 5).
        image: postgres:16-alpine
        env:
          # Not a secret. This container lives for the length of one job, is
          # reachable only from it, and holds nothing but fixtures.
          POSTGRES_USER: dfc_ci
          POSTGRES_PASSWORD: dfc_ci
          POSTGRES_DB: dfc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dfc_ci -d dfc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dfc_ci:dfc_ci@localhost:5432/dfc_ci

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      # Reversible, or explicitly marked irreversible and escalated before it runs
      # (CLAUDE.md, migration policy). Down and up again is how that stays true.
      - name: Apply migrations
        run: npm run migrate:up

      # `--all`, not a single down. Reverting only the newest migration checks
      # only the newest down section, so every stage that adds a file would
      # quietly shrink what this step covers.
      - name: Revert and re-apply migrations
        run: |
          npm run migrate:down -- --all
          npm run migrate:up

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  web:
    name: web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # `lint` runs three checks beyond ESLint, each holding a rule the
      # specification states and review would not catch: no API routes or server
      # actions (SKILL.md section 2), no design-system component framework
      # (section 2), and WCAG 2.2 AA contrast with no judgement-named token
      # (section 23, and sections 13, 17 and 19).
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # SKILL.md section 23 commits the web application to WCAG 2.2 Level AA, and
      # CLAUDE.md makes that checkable in three parts. The palette check runs in
      # `lint` above and needs no browser. This is the second: axe-core over every
      # route, in both themes, with a violation failing the build.
      #
      # It arrives with the first real screens, which is the condition CLAUDE.md
      # attached to it -- a browser harness over a placeholder page checks nothing.
      # The third part cannot be automated at all and is stated by the pull request
      # that adds a screen: keyboard operable end to end with focus visible and
      # never entirely obscured (2.4.7, 2.4.11), targets at least 24 by 24 CSS
      # pixels (2.5.8), and paste and password managers unobstructed on the
      # sign-in path (3.3.8).
      #
      # No database and no API process: the harness intercepts `/api/v1` in the
      # browser (`web/e2e/mock-api.ts`). axe inspects rendered DOM and cannot tell
      # where the JSON came from, so a full stack would buy nothing here and cost a
      # service dependency in a job that has to stay fast enough to keep.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Two suites: axe-core over every route in both themes, and the section 6
      # refresh-token rules, which are invisible from the screen -- a sign-out
      # that revokes nothing looks exactly like one that works.
      - name: Browser tests (axe-core, and the section 6 session rules)
        run: npm run test:browser

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
